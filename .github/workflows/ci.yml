name: Build and test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SearchPulse.Umbraco.sln
      - run: dotnet build SearchPulse.Umbraco.sln --configuration Release --no-restore
      - run: dotnet test SearchPulse.Umbraco.sln --configuration Release --no-build --verbosity normal
      - run: dotnet pack src/SearchPulse.Umbraco/SearchPulse.Umbraco.csproj --configuration Release --no-build --output artifacts
      - run: dotnet restore tests/SearchPulse.PackageSmoke/SearchPulse.PackageSmoke.csproj
      - run: dotnet build tests/SearchPulse.PackageSmoke/SearchPulse.PackageSmoke.csproj --configuration Release --no-restore
      - run: dotnet restore tests/SearchPulse.Umbraco.Integration/SearchPulse.Umbraco.Integration.csproj
      - run: dotnet build tests/SearchPulse.Umbraco.Integration/SearchPulse.Umbraco.Integration.csproj --configuration Release --no-restore
      - run: dotnet restore tests/SearchPulse.BrowserTests/SearchPulse.BrowserTests.csproj
      - run: dotnet build tests/SearchPulse.BrowserTests/SearchPulse.BrowserTests.csproj --configuration Release --no-restore
      - shell: pwsh
        run: ./tests/SearchPulse.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test tests/SearchPulse.BrowserTests/SearchPulse.BrowserTests.csproj --configuration Release --no-build --verbosity normal
      - shell: pwsh
        run: ./tests/SearchPulse.Umbraco.Integration/verify.ps1 -ResetDatabase

  verify-sql-server:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: SearchPulse-Sql-2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P SearchPulse-Sql-2026! -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SearchPulse.Umbraco.sln
      - run: dotnet build SearchPulse.Umbraco.sln --configuration Release --no-restore
      - run: dotnet pack src/SearchPulse.Umbraco/SearchPulse.Umbraco.csproj --configuration Release --no-build --output artifacts
      - run: dotnet restore tests/SearchPulse.Umbraco.Integration/SearchPulse.Umbraco.Integration.csproj
      - run: dotnet build tests/SearchPulse.Umbraco.Integration/SearchPulse.Umbraco.Integration.csproj --configuration Release --no-restore
      - shell: pwsh
        env:
          ConnectionStrings__umbracoDbDSN: Server=localhost,1433;Database=SearchPulseIntegrationSqlServer;User Id=sa;Password=SearchPulse-Sql-2026!;Encrypt=False;TrustServerCertificate=True
          ConnectionStrings__umbracoDbDSN_ProviderName: Microsoft.Data.SqlClient
        run: ./tests/SearchPulse.Umbraco.Integration/verify.ps1 -DatabaseProvider SqlServer
